# ============================================================
# rabbitmq.conf — cấu hình chung cho mọi node (dev & cluster)
# ============================================================

# ── Listeners ────────────────────────────────────────────────
listeners.tcp.default = 5672
management.tcp.port   = 15672

# Nạp topology (exchanges/queues/bindings) khi khởi động
management.load_definitions = /etc/rabbitmq/definitions.json

# ── Cluster formation (peer discovery qua classic config) ───
# 3 node: rabbitmq-1/2/3 — compose set hostname tương ứng.
# Node tự join cluster khi start; node đơn (dev) vẫn chạy bình thường.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3
cluster_formation.node_type              = disc

# ── Resource limits ──────────────────────────────────────────
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative          = 1.0

# ── Security ─────────────────────────────────────────────────
loopback_users.guest = false
